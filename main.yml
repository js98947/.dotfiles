---
- name: Setup Development Environment
  hosts: localhost
  become: yes
  vars:
    user_home: "{{ ansible_env.HOME }}"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install basic development packages
      apt:
        name:
          - git
          - curl
          - build-essential
          - cmake
          - unzip
          - pkg-config
          - python3
          - python3-pip
          - ninja-build
        state: present

    - name: Install or update Neovim from GitHub (source build)
      git:
        repo: https://github.com/neovim/neovim.git
        dest: "{{ user_home }}/.local/src/neovim"
        version: stable
        update: yes

    - name: Build Neovim
      shell: |
        make CMAKE_BUILD_TYPE=Release
        sudo make install
      args:
        chdir: "{{ user_home }}/.local/src/neovim"

    - name: Install Node.js (needed for some Neovim plugins)
      apt:
        name: nodejs
        state: present

    - name: Install npm
      apt:
        name: npm
        state: present

    - name: Install ripgrep (for telescope.nvim)
      apt:
        name: ripgrep
        state: present

    - name: Install fd (for telescope.nvim)
      apt:
        name: fd-find
        state: present


---
- name: Backup and encrypt directories
  hosts: localhost
  gather_facts: no
  vars:
    backup_dir: "{{ lookup('env', 'PWD') }}"  # Get the current directory from environment variables

    encrypt_pass_file: "$HOME/.dotfiles/.env/encrypt_pass"

  tasks:
    - name: Find directories in the current directory
      find:
        paths: "{{ backup_dir }}"
        file_type: directory
      register: found_dirs

    - name: Archive each directory
      command:
        cmd: "tar -czf {{ backup_dir }}/{{ item.path | basename }}.dir.tar.gz -C {{ backup_dir }} {{ item.path | basename }}"


      with_items: "{{ found_dirs.files }}"
      loop_control:
        label: "{{ item.path }}"
      register: archive_results

    - name: Encrypt each archive
      command:
        cmd: "ansible-vault encrypt {{ backup_dir }}/{{ item.item.path | basename }}.dir.tar.gz --vault-password-file {{ encrypt_pass_file }}"
      with_items: "{{ archive_results.results }}"
      loop_control:
        label: "{{ item.item.path }}"

